name: Desktop CI

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test API contracts, session and validation
        run: dotnet run --project tests/ApiChecks/ApiChecks.csproj --configuration Release

  build:
    needs: api-checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PIM4AdminDesktop.csproj
      - name: Build
        run: dotnet build PIM4AdminDesktop.csproj --configuration Release --no-restore
      - name: Check WPF screens
        run: dotnet run --project tests/DesktopUiChecks/DesktopUiChecks.csproj --configuration Release
      - name: Publish Windows package
        run: dotnet publish PIM4AdminDesktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/desktop
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: medishop-admin-win-x64
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: medishop-admin-win-x64
          path: package
      - name: Package downloads and checksums
        run: python3 scripts/package-download.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          downloads/MediShop-Admin-Windows-x64.exe
          downloads/MediShop-Admin-Windows-x64.zip
          downloads/SHA256SUMS.txt
          --target "$GITHUB_SHA" --title "MediShop Admin — $GITHUB_REF_NAME"
          --prerelease --notes-file docs/RELEASE-NOTES.md
