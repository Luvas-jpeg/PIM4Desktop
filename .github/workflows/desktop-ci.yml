name: Desktop CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test API contracts, session and validation
        run: dotnet run --project tests/ApiChecks/ApiChecks.csproj --configuration Release

  build:
    needs: api-checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PIM4AdminDesktop.csproj
      - name: Build
        run: dotnet build PIM4AdminDesktop.csproj --configuration Release --no-restore
      - name: Check WPF screens and capture documentation images
        run: dotnet run --project tests/DesktopUiChecks/DesktopUiChecks.csproj --configuration Release -- --screenshots artifacts/screenshots
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medishop-desktop-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish Windows package
        run: dotnet publish PIM4AdminDesktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/desktop
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: medishop-admin-win-x64
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 14
